services:
  - type: web
    name: quickchat-server
    runtime: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://variyaparth.github.io
      - key: REACT_APP_SERVER_URL
        value: https://quickchat-server.onrender.com
